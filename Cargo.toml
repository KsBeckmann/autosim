[package]
name = "autosim"
version = "1.0.4"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
ariadne = "0.5"
chumsky = "0.13.0"
clap = { version = "4.6.0", features = ["derive"] }
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }
logos = "0.16.1"

[build-dependencies]
winresource = "0.1"
